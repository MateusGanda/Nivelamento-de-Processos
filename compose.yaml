# Banco de dados local do GUNP, na mesma versão do PostgreSQL do banco da equipe.
# Uso: copie .env.example para .env, troque a senha e rode "docker compose up -d".
services:
  db:
    image: postgres:18-alpine
    container_name: gunp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gunp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-gunp}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - gunp-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gunp-db-data:
